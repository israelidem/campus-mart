<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Campus Mart">
  <!--
    The mark: a stamped "CM" on paper, the same idea as the receipt-stamp motif
    the interface uses for anything the server decided. Drawn rather than
    exported so it stays editable in review.
  -->
  <rect width="512" height="512" rx="96" fill="#0f7a4d" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f6f7f3" stroke-width="18" opacity="0.55" />
  <text
    x="256"
    y="256"
    fill="#f6f7f3"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="188"
    font-weight="700"
    letter-spacing="-6"
    text-anchor="middle"
    dominant-baseline="central"
  >CM</text>
</svg>
